services:
  postgres:
    image: postgres:16
    container_name: resource-booking-postgres
    environment:
      POSTGRES_DB: resource_booking
      POSTGRES_USER: resource_booking
      POSTGRES_PASSWORD: resource_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
